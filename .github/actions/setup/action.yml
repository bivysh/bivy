name: Set up Node and dependencies
description: >-
  pnpm, Node and a frozen install, plus the shared node_modules/.cache that the
  incremental typechecker, the ESLint cache and the test loader's transform cache
  all live in. Every lane pays this, so it is kept to the essentials.

inputs:
  cache-name:
    description: >-
      Names the warm-cache entry for this lane. Lanes keep separate entries so
      two jobs in the same run never race to save the same key. Leave empty to
      skip the warm cache entirely (for lanes that would not benefit).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.19.0'
    # Node's bundled corepack provides the pnpm version pinned in package.json's
    # packageManager in about a second; pnpm/action-setup took ~8s installing it
    # through npm. The store is cached directly, since setup-node's own pnpm
    # cache needs pnpm on PATH before Node is set up.
    - name: Enable pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable pnpm
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - run: pnpm install --frozen-lockfile
      shell: bash

    # Warm caches are a speed-up only: every consumer is keyed by content
    # (tsbuildinfo, ESLint's own metadata, content-addressed transform output),
    # so a stale or missing entry costs time, never correctness. The rolling key
    # means each run restores the newest entry and saves its own.
    - if: inputs.cache-name != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache
        key: warm-${{ inputs.cache-name }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          warm-${{ inputs.cache-name }}-${{ runner.os }}-

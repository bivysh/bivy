version: 2
# Every ecosystem waits `cooldown` days after a release before proposing it.
# Hijacked npm and Actions releases are usually caught and pulled within days,
# so this keeps them from ever reaching a PR. Security updates are not delayed.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    # typescript-eslint does not support TypeScript 7 yet, so the grouped bump
    # failed lint on every rebase and held up the rest of the group. Take the
    # major by hand once lint supports it.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # @sentry/node 11 hard-depends on @sentry/bundler-plugins, which pulls the
  # FSL-licensed `sentry` CLI (fails check:licenses) plus Babel into the
  # service runtime images. Take the major by hand once that edge is gone.
  - package-ecosystem: npm
    directory: /services/control-plane
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@sentry/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /services/relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@sentry/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /services/fleet
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

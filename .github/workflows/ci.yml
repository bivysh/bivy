name: CI

on:
  pull_request:
    branches: [main]
  # Merge queue validates the exact result of applying queued PRs to the latest
  # main. Without this event, the required ci-ok check never reports for the
  # temporary merge group and queued PRs eventually time out.
  merge_group:
    types: [checks_requested]
  # Lets other workflows call this one to run the exact same gate rather than
  # re-implementing it. Used by release.yml so a production promotion runs the
  # full suite before publishing, instead of a hand-rolled subset that can drift
  # from what a PR actually has to pass.
  workflow_call:
    inputs:
      force_all:
        description: Run every gated job regardless of changed-path filters (release tags).
        required: false
        type: boolean
        default: false

# Cancel superseded runs: a new push to the same PR aborts the previous,
# still-running CI so runners are not occupied by a commit that has already been
# replaced. Reusable release calls are grouped by their ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which areas a change actually touches so we only run relevant jobs.
  # Even though standard runners are free for this public repository, filtering
  # keeps feedback focused and leaves the account's concurrency available for
  # other PRs. Changing ci.yml itself re-runs everything (the `common` anchor is
  # folded into every filter) so CI cannot disable its own coverage unnoticed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      root: ${{ steps.filter.outputs.root }}
      relay: ${{ steps.filter.outputs.relay }}
      control_plane: ${{ steps.filter.outputs.control_plane }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # Actions execute privileged workflow code; pin them to immutable commits
      # rather than mutable major-version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            common: &common
              - '.github/workflows/ci.yml'
            root:
              - *common
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'src/**'
              - 'packages/**'
              - 'bin/**'
              - 'test/**'
              - 'scripts/**'
              - 'certification/**'
            relay:
              - *common
              - 'services/relay/**'
              - 'services/control-plane/**'
            control_plane:
              - *common
              - 'services/control-plane/**'
            e2e:
              - *common
              - 'pnpm-lock.yaml'
              - 'src/**'
              - 'packages/core/**'
              - 'services/relay/**'
              - 'services/control-plane/**'
              - 'test/**'
            docs:
              - *common
              - 'docs/**'
              - '*.md'
              - 'scripts/check-links.mjs'

  # Root checks are split by responsibility. Standard GitHub-hosted runners are
  # free for this public repository, so running these in parallel gives much
  # faster feedback without consuming the private-repository minutes allowance.
  root-security:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    name: Root security + policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Verify the transitive security pins actually took effect on disk, and
      # that package.json (which resolves the published npm artifact) and
      # pnpm-workspace.yaml (which resolves what CI tests) declare the same ones.
      # This replaces an older check for pi-coding-agent's patched NESTED
      # node_modules: pnpm ignores a dependency's shrinkwrap, so those nested
      # copies no longer exist here at all. See scripts/check-security-pins.mjs.
      - run: pnpm run check:pins
      # Production dependencies ship to users; do not release an unreviewed
      # high/critical advisory. audit:prod applies the documented narrow
      # allowlist in scripts/audit-prod.mjs.
      - run: pnpm run audit:prod
      - run: pnpm run check:licenses
      - run: pnpm run check:secrets -- --current-only

  root-quality:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    name: Root lint + typechecks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check:boundaries
      - run: pnpm run check:routes
      - run: pnpm run check:design
      - run: pnpm run typecheck
      - run: pnpm run typecheck:web

  root-tests:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    name: Root unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A healthy shard finishes in ~2 min. Without this a single hung suite
    # keeps the job (and the merge queue) waiting for GitHub's 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:core
        if: matrix.shard == '1/2'
      # Each machine gets a stable shard; within it, run independent suites
      # across the runner's CPUs while serializing suites with a shared port.
      - run: pnpm run test:unit
        env:
          TEST_SHARD: ${{ matrix.shard }}

  root-builds:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    name: Web + release builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Initial-bundle budget (B4b): fail if the PWA entry chunk grows past its
      # raw/gzip ceiling. The long-transcript budget runs in test:unit.
      - run: pnpm run build:web
      - run: node scripts/check-bundle-size.mjs
      # Exercise the emitted node RELEASE build and curated standalone package,
      # which catches cross-boundary imports that tsc --noEmit can miss. Pack it
      # once here so both consumer OS jobs test identical bytes without each
      # repeating the compile and lockfile generation.
      - run: node scripts/build-release.mjs --pack release-artifact
      - name: Upload release package for consumer tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: release-artifact/bivy-latest.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The Supported promise is a release gate of its own. Run deterministic pinned
  # fixtures on every certified OS family; no live credentials or latest-version
  # resolution is allowed in this lane.
  agent-certification:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    name: Pinned agent certification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run certification:check
      - run: pnpm exec tsx test/agent-certification.test.ts

  # Install the exact curated npm tarball into a fresh consumer project on both
  # supported desktop OS families. This catches release-only dependency/audit,
  # native-module, README metadata, and built-in Pi discovery regressions.
  release-consumer:
    needs: [changes, root-builds]
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    name: Release consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifact
      - run: node scripts/smoke-release.mjs --artifact release-artifact/bivy-latest.tar.gz

  # The PWA is a principal product client. Playwright parallelizes its test files
  # and desktop/mobile projects within this runner.
  browser:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - name: Upload PWA screenshot review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pwa-screenshots
          path: |
            test/browser/screenshots.spec.ts-snapshots/*.png
            test-results/**
          if-no-files-found: error
          retention-days: 14

  # Cheap, dependency-free check: no install is needed because check-links only
  # uses node:fs/node:path. Its own filter keeps docs-only feedback fast.
  docs-links:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - run: node scripts/check-links.mjs

  # Service checks use separate runners so control-plane verification does not
  # block relay feedback. The relay suite still installs control-plane because it
  # spawns that service as a child process for integration coverage.
  control-plane:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.control_plane == 'true'
    name: Control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # services/* are standalone npm projects with their own package-lock.json;
      # only the repo root migrated to pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: services/control-plane/package-lock.json
      - run: npm ci
        working-directory: services/control-plane
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/control-plane
      - run: npm run typecheck
        working-directory: services/control-plane
      - run: npm run test:unit
        working-directory: services/control-plane

  relay:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.relay == 'true'
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # services/* are standalone npm projects with their own package-lock.json;
      # only the repo root migrated to pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            services/relay/package-lock.json
            services/control-plane/package-lock.json
      - run: npm ci
        working-directory: services/control-plane
      - run: npm ci
        working-directory: services/relay
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/relay
      - run: npm run typecheck
        working-directory: services/relay
      - run: npm run --if-present test:unit
        working-directory: services/relay

  # Run the independent remote-path and X25519 pairing suites on separate
  # runners. This duplicates setup but minimizes wall-clock time on public-repo
  # runners and keeps each suite's service ports isolated.
  remote-e2e:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.e2e == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Remote path e2e
            script: test/remote-e2e.ts
          - name: X25519 pairing e2e
            script: test/remote-pairing-e2e.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: services/control-plane
      - run: npm ci
        working-directory: services/relay
      - run: pnpm exec tsx ${{ matrix.script }}

  # Single gate for branch protection. Always runs, and passes only if no needed
  # job failed or was cancelled. A skipped job means its area was untouched and
  # is expected. Keep this as the sole required status check.
  ci-ok:
    if: ${{ always() }}
    needs:
      - changes
      - root-security
      - root-quality
      - root-tests
      - root-builds
      - agent-certification
      - release-consumer
      - browser
      - docs-links
      - control-plane
      - relay
      - remote-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify no required job failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A CI job failed or was cancelled." >&2
            exit 1
          fi
          echo "CI passed (skipped jobs are expected when their area was untouched)."

name: CI

on:
  # Stacked follow-ups need the same checks before their parent merges.
  pull_request:
  # Merge queue validates the exact result of applying queued PRs to the latest
  # main. Without this event, the required ci-ok check never reports for the
  # temporary merge group and queued PRs eventually time out.
  merge_group:
    types: [checks_requested]
  # Nightly full run: the cross-OS, packaging and e2e lanes that no longer gate
  # every PR still run against main once a day.
  schedule:
    - cron: '17 3 * * *'
  # Also how release.yml runs the full suite on a release tag that has no CI
  # receipt, instead of a hand-rolled subset that can drift from what a PR
  # actually has to pass.
  workflow_dispatch:

# Cancel superseded runs: a new push to the same PR aborts the previous,
# still-running CI so runners are not occupied by a commit that has already been
# replaced. Dispatched runs are grouped by their ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Four tiers. Gate and full respect the changed-path filters below.
#
#   gate   every PR push AND the merge queue, with identical checks: the queue
#          only re-validates the PR against the latest main, it never adds a
#          check the PR did not see. Lint, types, policy, every unit and core
#          suite, the web build, the release package, a fresh npm consumer on
#          Linux, the browser suite when the app changes, and packaging /
#          installer / remote e2e lanes when their inputs change.
#   full   nightly, manual (including release.yml's fallback) and any change to
#          this file: everything, including the macOS lanes. Every job runs and
#          must succeed; keep event-specific jobs out of here.
#   release  a PR or queue entry that only changes manifest versions and
#          CHANGELOG.md (scripts/release-only-diff.mjs), such as the version
#          bump after a release: policy checks and release-notes validation.
#          The code it carries already passed CI on main.
#   verified  a queue entry whose exact tree already passed on a PR run of the
#          PR's current head (scripts/find-ci-receipt.sh): main has not moved
#          since, so every lane would repeat that result. Nothing runs but
#          ci-ok. When main has moved, the tree differs and the queue runs gate.
jobs:
  # Detect which areas a change actually touches so we only run relevant jobs,
  # and which tier this run is. Changing ci.yml itself runs the full tier so CI
  # cannot disable its own coverage unnoticed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read # look up a PR run's receipt for the queued tree
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      # The tree this run tests; a green PR run records it as its receipt.
      tree: ${{ steps.tier.outputs.tree }}
      # Policy checks run in every tier but verified, and in gate only when
      # root-level inputs change.
      policy: ${{ steps.tier.outputs.policy }}
      # Area filters apply to gate and full. A release tier touches only
      # versions and notes, and a verified tier runs nothing, so none fires.
      root: ${{ steps.tier.outputs.areas == 'true' && steps.filter.outputs.root || 'false' }}
      web: ${{ steps.tier.outputs.areas == 'true' && steps.filter.outputs.web || 'false' }}
      installer: ${{ steps.tier.outputs.areas == 'true' && steps.filter.outputs.installer || 'false' }}
      relay: ${{ steps.tier.outputs.areas == 'true' && steps.filter.outputs.relay || 'false' }}
      control_plane: ${{ steps.tier.outputs.areas == 'true' && steps.filter.outputs.control_plane || 'false' }}
      e2e: ${{ steps.tier.outputs.areas == 'true' && steps.filter.outputs.e2e || 'false' }}
      docs: ${{ steps.tier.outputs.tier != 'verified' && steps.filter.outputs.docs || 'false' }}
    steps:
      # Actions execute privileged workflow code; pin them to immutable commits
      # rather than mutable major-version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-only check diffs against the base; history without
          # every old blob is enough.
          fetch-depth: 0
          filter: blob:none
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            common: &common
              - '.github/workflows/ci.yml'
            # A clean OS bootstrap is an installer/packaging gate, not a second
            # npm consumer test for every application change. Root includes the
            # same paths so the artifact producer always runs with this job.
            installer: &installer
              - *common
              - '.github/workflows/release.yml'
              - 'install.sh'
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'packages/**/package.json'
              - 'bin/**'
              - 'scripts/build-release.mjs'
              - 'scripts/release-*.mjs'
              - 'scripts/smoke-*.mjs'
              - 'scripts/smoke-installer.sh'
              - 'scripts/installer-smoke-guest.sh'
              - 'scripts/wait-release-artifact.sh'
              - 'test/installer*'
              - 'test/ci-installer-gate.test.ts'
            root:
              - *installer
              - 'package.json'
              - 'install.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'src/**'
              - 'packages/**'
              - 'bin/**'
              - 'test/**'
              - 'scripts/**'
              - 'certification/**'
            # Everything the browser suite renders or runs against.
            web:
              - *common
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'
              - 'packages/web/**'
              - 'packages/ui/**'
              - 'packages/core/**'
              - 'test/browser/**'
            relay:
              - *common
              - 'services/relay/**'
              - 'services/control-plane/**'
            control_plane:
              - *common
              - 'services/control-plane/**'
            e2e:
              - *common
              - 'pnpm-lock.yaml'
              - 'src/**'
              - 'packages/core/**'
              - 'services/relay/**'
              - 'services/control-plane/**'
              - 'test/**'
            docs:
              - *common
              - 'docs/**'
              - '*.md'
              - 'scripts/check-links.mjs'
      - id: tier
        env:
          EVENT: ${{ github.event_name }}
          CI_CHANGED: ${{ steps.filter.outputs.common }}
          ROOT_CHANGED: ${{ steps.filter.outputs.root }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version bump (manifest versions + CHANGELOG.md only) carries code
          # main already tested, so it runs the light release tier: policy
          # checks plus release-notes validation.
          # A PR checks out its test merge, whose first parent is current main.
          case "$EVENT" in
            merge_group) base="$QUEUE_BASE" ;;
            pull_request) base=HEAD^1 ;;
            *) base= ;;
          esac
          release_only=false
          if [ -n "$base" ]; then
            release_only="$(node scripts/release-only-diff.mjs "$base" HEAD)"
          fi
          if [ "$EVENT" = merge_group ] && [ "$(bash scripts/find-ci-receipt.sh "$QUEUE_REF")" = true ]; then
            tier=verified
          elif [ "$release_only" = true ]; then
            tier=release
          elif [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$CI_CHANGED" = true ]; then
            tier=full
          else
            tier=gate
          fi
          case "$tier" in
            gate|full) areas=true ;;
            *) areas=false ;;
          esac
          policy=false
          if [ "$tier" = full ] || [ "$tier" = release ] || { [ "$tier" = gate ] && [ "$ROOT_CHANGED" = true ]; }; then
            policy=true
          fi
          {
            echo "tier=$tier"
            echo "areas=$areas"
            echo "policy=$policy"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"
          echo "CI tier: $tier" >> "$GITHUB_STEP_SUMMARY"

  # Lanes are sized around two limits. A free plan runs at most 20 jobs at once
  # across every workflow, and each lane pays ~15s of checkout and install. When
  # one run fanned out to ~20 small lanes it queued behind its own jobs for
  # 40-50s, and far longer when another PR was also running. So cheap checks
  # share a runner and run concurrently on its four cores (scripts/ci-parallel.mjs),
  # and only the suites long enough to set the critical path (unit, browser) are
  # sharded. A typical app change runs nine lanes, so two PRs fit side by side.
  # Every lane below is a leaf: nothing depends on it except ci-ok, so they all
  # start at once.

  # Policy, docs links, lint, both typecheckers and the web build with its
  # bundle budget. Lint and tsc are incremental (warm cache below), so none of
  # these takes longer than the setup it shares.
  static:
    needs: changes
    if: needs.changes.outputs.policy == 'true' || needs.changes.outputs.docs == 'true'
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # check-links only uses node:fs/node:path, so the runner's own Node does,
      # and a docs-only change needs no install.
      - name: Docs links
        if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.docs == 'true'
        run: node scripts/check-links.mjs
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.policy == 'true'
        with:
          cache-name: static
      # check:pins verifies the transitive security pins actually took effect on
      # disk, and that package.json (which resolves the published npm artifact)
      # and pnpm-workspace.yaml (which resolves what CI tests) declare the same
      # ones. audit:prod blocks unreviewed high/critical advisories in
      # production dependencies, with the narrow allowlist in
      # scripts/audit-prod.mjs. Release notes collect under [Unreleased] until
      # `pnpm release` tags main; release.yml publishes that section.
      - name: Policy checks
        if: needs.changes.outputs.policy == 'true'
        run: >-
          node scripts/ci-parallel.mjs
          "pnpm run check:pins"
          "pnpm run audit:prod"
          "pnpm run check:licenses"
          "pnpm run check:secrets -- --current-only"
          "pnpm run check:boundaries"
          "pnpm run check:routes"
          "pnpm run check:design"
          "pnpm run certification:check"
          "grep -q '^## \[Unreleased\]' CHANGELOG.md || { echo 'CHANGELOG.md needs a ## [Unreleased] section.'; exit 1; }"
      # Emitting the PWA bundle also catches imports tsc --noEmit can miss.
      - name: Lint, types, web build + bundle budget
        if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
        run: >-
          node scripts/ci-parallel.mjs
          "pnpm run lint"
          "pnpm run typecheck"
          "pnpm run typecheck:web"
          "pnpm run build:web && node scripts/check-bundle-size.mjs"

  # The node unit suites, split across runners. The whole set is ~300 suites and
  # parallelises almost perfectly (it measured 98% efficient on one 4-core box),
  # so it scales with runners. Every run executes every suite: on three shards
  # the whole set costs ~20s of test time per shard, about what narrowing a PR
  # to the suites it can reach used to, and it makes a green PR run a complete
  # receipt the merge queue can reuse. The core package's vitest suite rides
  # along on the first shard.
  unit:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            core: true
          - shard: 2
          - shard: 3
    env:
      TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-name: unit-${{ matrix.shard }}
      # Desktop app views run on TigerVNC's X server; with it installed the
      # display test drives a real one instead of skipping. Only the shard that
      # actually got that suite pays the apt install.
      - name: Install TigerVNC if this shard runs the display suite
        run: |
          if pnpm run test:unit -- --list | grep -qx 'app-display.test.ts'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends tigervnc-standalone-server
          else
            echo "display suite not in this shard; skipping TigerVNC"
          fi
      # Within the runner, independent suites run across its CPUs while suites
      # with a shared port are serialized (scripts/run-tests.mjs).
      - run: pnpm run test:unit
      - run: pnpm run test:core
        if: matrix.core
      # The loader's transform cache is content-addressed, so entries accumulate
      # across runs. Cap it before the warm cache is saved. After the suites, so
      # this run always had a fully warm cache.
      - run: node scripts/prune-ts-cache.mjs
        if: always()

  # Build the platform-independent release package, then install that exact
  # curated npm tarball into a fresh consumer project. Emitting JavaScript and
  # curating the package catches cross-boundary imports that tsc --noEmit can
  # miss; the consumer catches release-only dependency/audit, native-module,
  # README metadata, and built-in Pi discovery regressions, which ordinary
  # source changes cause too. One lane, so the Linux consumer never waits on an
  # artifact upload.
  package:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Release package + npm consumer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Pack the exact npm payload; unlike the fallback archive it needs no
      # excluded package-lock.
      - run: node scripts/build-release.mjs --npm-pack release-artifact
      # Only the macOS consumer and the clean installer, which run when
      # packaging inputs change, consume the package from another runner.
      - name: Upload release package for packaging lanes
        if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.installer == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: release-artifact/bivy-npm.tgz
          if-no-files-found: error
          retention-days: 1
      # Cache registry downloads, never node_modules or an installed Bivy. The
      # consumer project remains fresh and executes all package lifecycle hooks.
      - name: Cache consumer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: consumer-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: consumer-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify fresh npm consumers
        run: node scripts/smoke-release.mjs --artifact release-artifact/bivy-npm.tgz

  # The Supported promise on every certified OS family. The Linux fixtures also
  # run in the unit suite; this lane adds macOS and runs in the full tier.
  agent-certification:
    needs: changes
    if: needs.changes.outputs.tier == 'full'
    name: Pinned agent certification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run certification:check
      - run: pnpm exec tsx test/agent-certification.test.ts

  # The same fresh npm consumer on macOS, when packaging inputs change and in
  # the full tier. It prepares while the package lane builds; the bounded
  # artifact wait below replaces a whole-job dependency.
  release-consumer-macos:
    needs: changes
    permissions:
      contents: read
      actions: read
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.installer == 'true'
    name: Release consumer (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Cache consumer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: consumer-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: consumer-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Wait for this run's release package
        run: bash scripts/wait-release-artifact.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifact
      - name: Verify fresh npm consumers
        run: node scripts/smoke-release.mjs --artifact release-artifact/bivy-npm.tgz

  # apt/Node bootstrap can take minutes on a cold Ubuntu mirror. Keep the real
  # fresh-machine promise, but pay for it only when its inputs change or in the
  # full tier.
  installer-smoke:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.installer == 'true'
    name: Clean installer (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache only downloads. Every guest starts without Node, build tools or
      # Bivy; registry integrity checks and package lifecycle hooks still run.
      - name: Cache installer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bivy-installer-npm
            ~/.cache/bivy-installer-apt
          key: installer-downloads-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'install.sh', 'scripts/smoke-installer.sh', 'scripts/installer-smoke-guest.sh') }}
          restore-keys: installer-downloads-${{ runner.os }}-${{ runner.arch }}-ubuntu24-
      - name: Prepare clean guest concurrently with packaging
        run: bash scripts/installer-smoke-guest.sh start
      - name: Wait for this run's release package
        run: bash scripts/wait-release-artifact.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifact
      - name: Verify clean-machine installer
        run: bash scripts/installer-smoke-guest.sh test
      - name: Dispose installer guest
        if: always()
        run: bash scripts/installer-smoke-guest.sh cleanup

  # The browser suite runs whenever the app changes. It is ~150 tests and ~370
  # test-seconds; a single 4-worker runner spent 90s on it, so it is split the
  # same way as the unit suite. Playwright's own --shard balances by file.
  browser:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.web == 'true'
    name: Browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Key the browser on Playwright's own version, not the whole lockfile, so
      # an unrelated dependency bump does not re-download it on every shard.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # Install fonts as well as shared libraries: a successful browser launch
      # alone does not guarantee the screenshot environment matches baselines.
      # --with-deps shells out to apt every time, so on a cache hit (the browser
      # and its system libraries are already present) install the shell alone.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        if: steps.chromium.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install --only-shell chromium
        if: steps.chromium.outputs.cache-hit == 'true'
      - run: pnpm run test:browser --project=behavior --project=desktop --project=mobile --shard=${{ matrix.shard }}/3 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/timings.json
      - name: Upload PWA screenshot review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-screenshots-${{ matrix.shard }}
          path: |
            test/browser/screenshots.spec.ts-snapshots/*.png
            test-results/**
          if-no-files-found: error
          retention-days: 14

  # Service checks use separate runners so control-plane verification does not
  # block relay feedback. They are cheap and path-filtered, so they run in every
  # tier. The relay suite still installs control-plane because it spawns that
  # service as a child process for integration coverage.
  control-plane:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.control_plane == 'true'
    name: Control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: native_push_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NATIVE_PUSH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/native_push_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # services/* are standalone npm projects with their own package-lock.json;
      # only the repo root migrated to pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: services/control-plane/package-lock.json
      - run: npm ci
        working-directory: services/control-plane
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/control-plane
      - run: npm run typecheck
        working-directory: services/control-plane
      - run: npm run test:unit
        working-directory: services/control-plane

  relay:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.relay == 'true'
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # services/* are standalone npm projects with their own package-lock.json;
      # only the repo root migrated to pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            services/relay/package-lock.json
            services/control-plane/package-lock.json
      - run: npm ci
        working-directory: services/control-plane
      - run: npm ci
        working-directory: services/relay
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/relay
      - run: npm run typecheck
        working-directory: services/relay
      - run: npm run --if-present test:unit
        working-directory: services/relay

  # The remote-path and X25519 pairing suites each start their own control
  # plane and relay on free ports, so they run side by side on one runner. They
  # run whenever the node, core or services change.
  remote-e2e:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.e2e == 'true'
    name: Remote path + X25519 pairing e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install services
        run: >-
          node scripts/ci-parallel.mjs
          "npm ci --prefix services/control-plane"
          "npm ci --prefix services/relay"
      - name: Remote e2e suites
        run: >-
          node scripts/ci-parallel.mjs
          "pnpm exec tsx test/remote-e2e.ts"
          "pnpm exec tsx test/remote-pairing-e2e.ts"

  # Single gate for branch protection. Always runs, and passes only if no needed
  # job failed or was cancelled. A skipped job means its area was untouched or
  # its tier did not run it. Keep this as the sole required status check.
  #
  # A green pull-request run also records the tree it tested as a receipt. If
  # main has not moved by the time the PR is queued, the queue builds the same
  # tree and reuses this result (the verified tier) instead of repeating it.
  ci-ok:
    if: ${{ always() }}
    needs:
      - changes
      - static
      - unit
      - package
      - agent-certification
      - release-consumer-macos
      - installer-smoke
      - browser
      - control-plane
      - relay
      - remote-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify no required job failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A CI job failed or was cancelled." >&2
            exit 1
          fi
          echo "CI passed (skipped jobs are expected when their area was untouched)."
      - name: Write receipt
        if: github.event_name == 'pull_request'
        run: echo "${{ github.run_id }}" > ci-receipt.txt
      - name: Record receipt for the merge queue
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-receipt-${{ needs.changes.outputs.tree }}
          path: ci-receipt.txt
          retention-days: 7

name: CI

on:
  # Stacked follow-ups need the same checks before their parent merges.
  pull_request:
  # Merge queue validates the exact result of applying queued PRs to the latest
  # main. Without this event, the required ci-ok check never reports for the
  # temporary merge group and queued PRs eventually time out.
  merge_group:
    types: [checks_requested]
  # Nightly full run: the cross-OS, packaging and e2e lanes that no longer gate
  # every PR still run against main once a day.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # Lets other workflows call this one to run the exact same gate rather than
  # re-implementing it. Used by release.yml so a production promotion runs the
  # full suite before publishing, instead of a hand-rolled subset that can drift
  # from what a PR actually has to pass.
  workflow_call:
    inputs:
      force_all:
        description: Run every gated job regardless of changed-path filters (release tags).
        required: false
        type: boolean
        default: false

# Cancel superseded runs: a new push to the same PR aborts the previous,
# still-running CI so runners are not occupied by a commit that has already been
# replaced. Reusable release calls are grouped by their ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Two tiers. Both respect the changed-path filters below.
#
#   gate   every PR push AND the merge queue, with identical checks: the queue
#          only re-validates the PR against the latest main, it never adds a
#          check the PR did not see. Lint, types, policy, every unit and core
#          suite, the web build, the release package, a fresh npm consumer on
#          Linux, the browser suite when the app changes, and packaging /
#          installer / remote e2e lanes when their inputs change.
#   full   nightly, manual, release (force_all), a queued release commit and
#          any change to this file: everything, including the macOS lanes.
#          Every job runs and must succeed, so release.yml can reuse a full run
#          on the same SHA; keep event-specific jobs out of here.
jobs:
  # Detect which areas a change actually touches so we only run relevant jobs,
  # and which tier this run is. Changing ci.yml itself runs the full tier so CI
  # cannot disable its own coverage unnoticed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      consumer_os: ${{ steps.tier.outputs.consumer_os }}
      root: ${{ steps.filter.outputs.root }}
      web: ${{ steps.filter.outputs.web }}
      installer: ${{ steps.filter.outputs.installer }}
      relay: ${{ steps.filter.outputs.relay }}
      control_plane: ${{ steps.filter.outputs.control_plane }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # Actions execute privileged workflow code; pin them to immutable commits
      # rather than mutable major-version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            common: &common
              - '.github/workflows/ci.yml'
            # A clean OS bootstrap is an installer/packaging gate, not a second
            # npm consumer test for every application change. Root includes the
            # same paths so the artifact producer always runs with this job.
            installer: &installer
              - *common
              - '.github/workflows/release.yml'
              - 'install.sh'
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'packages/**/package.json'
              - 'bin/**'
              - 'scripts/build-release.mjs'
              - 'scripts/release-*.mjs'
              - 'scripts/smoke-*.mjs'
              - 'scripts/smoke-installer.sh'
              - 'scripts/installer-smoke-guest.sh'
              - 'scripts/wait-release-artifact.sh'
              - 'test/installer*'
              - 'test/ci-installer-gate.test.ts'
            root:
              - *installer
              - 'package.json'
              - 'install.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'src/**'
              - 'packages/**'
              - 'bin/**'
              - 'test/**'
              - 'scripts/**'
              - 'certification/**'
            # Everything the browser suite renders or runs against.
            web:
              - *common
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'
              - 'packages/web/**'
              - 'packages/ui/**'
              - 'packages/core/**'
              - 'test/browser/**'
            relay:
              - *common
              - 'services/relay/**'
              - 'services/control-plane/**'
            control_plane:
              - *common
              - 'services/control-plane/**'
            e2e:
              - *common
              - 'pnpm-lock.yaml'
              - 'src/**'
              - 'packages/core/**'
              - 'services/relay/**'
              - 'services/control-plane/**'
              - 'test/**'
            docs:
              - *common
              - 'docs/**'
              - '*.md'
              - 'scripts/check-links.mjs'
      - id: tier
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          EVENT: ${{ github.event_name }}
          CI_CHANGED: ${{ steps.filter.outputs.common }}
          INSTALLER_CHANGED: ${{ steps.filter.outputs.installer }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # A queued release commit (`pnpm release` bumps package.json's version)
          # runs the full tier: release.yml then reuses this run on the merged
          # SHA instead of repeating full CI before promotion.
          release=false
          if [ "$EVENT" = merge_group ]; then
            version() { node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)'; }
            if [ "$(git show "$QUEUE_BASE:package.json" | version)" != "$(version < package.json)" ]; then release=true; fi
          fi
          if [ "$FORCE_ALL" = true ] || [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$CI_CHANGED" = true ] || [ "$release" = true ]; then
            tier=full
          else
            tier=gate
          fi
          # The npm consumer runs on Linux for every app change; macOS joins in
          # the full tier and whenever packaging inputs change.
          if [ "$tier" = full ] || [ "$INSTALLER_CHANGED" = true ]; then
            consumer_os='["ubuntu-latest","macos-latest"]'
          else
            consumer_os='["ubuntu-latest"]'
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "consumer_os=$consumer_os" >> "$GITHUB_OUTPUT"
          echo "CI tier: $tier" >> "$GITHUB_STEP_SUMMARY"

  # The root checks used to share one runner: nine independent commands ran
  # back-to-back while three of the box's four cores sat idle, and the unit
  # suite ran unsharded at the end. Setup was merged into one job to avoid
  # paying checkout+install repeatedly, but that traded ~23s of setup for ~170s
  # of serialisation.
  #
  # They are separate lanes again, because for a public repository extra runners
  # are free and run at the same time. Setup is now the floor on each lane, so it
  # is a shared composite action that also restores a warm cache (see
  # .github/actions/setup). Every lane below is a leaf: nothing depends on it
  # except ci-ok, so they all start at once.

  # Policy and metadata checks. Seconds of work each, no build needed.
  policy:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Verify the transitive security pins actually took effect on disk, and
      # that package.json (which resolves the published npm artifact) and
      # pnpm-workspace.yaml (which resolves what CI tests) declare the same ones.
      # See scripts/check-security-pins.mjs.
      - run: pnpm run check:pins
      # Production dependencies ship to users; do not release an unreviewed
      # high/critical advisory. audit:prod applies the documented narrow
      # allowlist in scripts/audit-prod.mjs.
      - run: pnpm run audit:prod
      - run: pnpm run check:licenses
      - run: pnpm run check:secrets -- --current-only
      - run: pnpm run check:boundaries
      - run: pnpm run check:routes
      - run: pnpm run check:design
      - run: pnpm run certification:check

  # ESLint, with its cache restored. A warm run only lints changed files, which
  # takes it from ~24s to ~2s; a cold one is no slower than before.
  lint:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-name: lint
      - run: pnpm run lint

  # Both typecheckers, incrementally and at the same time as each other. They
  # are independent tsc invocations, so running them in sequence just added the
  # smaller one's time to the lane.
  types:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-name: types
      - name: typecheck + typecheck:web
        run: |
          pnpm run typecheck & root=$!
          pnpm run typecheck:web & web=$!
          # Wait for both and fail if either did, rather than letting the last
          # one's status decide the step.
          failed=0
          wait $root || failed=1
          wait $web || failed=1
          exit $failed

  # The node unit suites, split across runners. The whole set is ~300 suites and
  # parallelises almost perfectly (it measured 98% efficient on one 4-core box),
  # so it scales with cores, and four free runners give four times as many as
  # one. On a pull request each shard first narrows to the suites the change can
  # actually reach; the merge queue and nightly always run everything, so a
  # suite the selection misses still gates the merge.
  unit:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change selection diffs against the merge base, which needs history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-name: unit-${{ matrix.shard }}
      - name: Select suites for this shard
        id: select
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Only a pull-request push narrows; every other event runs the lot.
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ needs.changes.outputs.tier }}" != full ]; then
            git fetch --no-tags --depth=0 origin "$BASE_REF"
            echo "args=--changed-since origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      # Desktop app views run on TigerVNC's X server; with it installed the
      # display test drives a real one instead of skipping. Only the shard that
      # actually got that suite pays the apt install.
      - name: Install TigerVNC if this shard runs the display suite
        run: |
          if node scripts/run-tests.mjs --list ${{ steps.select.outputs.args }} | grep -qx 'app-display.test.ts'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends tigervnc-standalone-server
          else
            echo "display suite not in this shard; skipping TigerVNC"
          fi
      # Within the runner, independent suites run across its CPUs while suites
      # with a shared port are serialized (scripts/run-tests.mjs).
      - run: node scripts/run-tests.mjs ${{ steps.select.outputs.args }}

  core:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Core suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run test:core

  # Initial-bundle budget (B4b): fail if the PWA entry chunk grows past its
  # raw/gzip ceiling. The long-transcript budget runs in the unit suite.
  web-build:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Web build + bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-name: web-build
      - run: pnpm run build:web && node scripts/check-bundle-size.mjs

  # Build the platform-independent release package. Emitting JavaScript and
  # curating the package catches cross-boundary imports that tsc --noEmit can
  # miss.
  root-release:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --filter @bivy/bivy --frozen-lockfile
      # Pack the exact npm payload; unlike the fallback archive it needs no
      # excluded package-lock.
      - run: node scripts/build-release.mjs --npm-pack release-artifact
      - name: Upload release package for consumer tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: release-artifact/bivy-npm.tgz
          if-no-files-found: error
          retention-days: 1

  # The Supported promise on every certified OS family. The Linux fixtures also
  # run in the unit suite; this lane adds macOS and runs in the full tier.
  agent-certification:
    needs: changes
    if: needs.changes.outputs.tier == 'full'
    name: Pinned agent certification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run certification:check
      - run: pnpm exec tsx test/agent-certification.test.ts

  # Install the exact curated npm tarball into a fresh consumer project on both
  # supported desktop OS families. This catches release-only dependency/audit,
  # native-module, README metadata, and built-in Pi discovery regressions, which
  # ordinary source changes cause too, so Linux runs for every app change.
  release-consumer:
    # Prepare the consumer while root-release builds. The bounded artifact
    # wait below replaces the whole-job dependency; ci-ok still gates both jobs.
    needs: changes
    permissions:
      contents: read
      actions: read
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.root == 'true'
    name: Release consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.consumer_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      # Cache registry downloads, never node_modules or an installed Bivy. Both
      # consumer projects remain fresh and execute all package lifecycle hooks.
      - name: Cache consumer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: consumer-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: consumer-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Wait for this run's release package
        run: bash scripts/wait-release-artifact.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifact
      - name: Verify fresh npm consumers
        run: node scripts/smoke-release.mjs --artifact release-artifact/bivy-npm.tgz

  # apt/Node bootstrap can take minutes on a cold Ubuntu mirror. Keep the real
  # fresh-machine promise, but pay for it only when its inputs change or in the
  # full tier.
  installer-smoke:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.installer == 'true'
    name: Clean installer (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache only downloads. Every guest starts without Node, build tools or
      # Bivy; registry integrity checks and package lifecycle hooks still run.
      - name: Cache installer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bivy-installer-npm
            ~/.cache/bivy-installer-apt
          key: installer-downloads-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'install.sh', 'scripts/smoke-installer.sh', 'scripts/installer-smoke-guest.sh') }}
          restore-keys: installer-downloads-${{ runner.os }}-${{ runner.arch }}-ubuntu24-
      - name: Prepare clean guest concurrently with packaging
        run: bash scripts/installer-smoke-guest.sh start
      - name: Wait for this run's release package
        run: bash scripts/wait-release-artifact.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-artifact
      - name: Verify clean-machine installer
        run: bash scripts/installer-smoke-guest.sh test
      - name: Dispose installer guest
        if: always()
        run: bash scripts/installer-smoke-guest.sh cleanup

  # The browser suite runs whenever the app changes. It is ~120 tests and ~310
  # test-seconds; a single 4-worker runner spent 90s on it, so it is split the
  # same way as the unit suite. Playwright's own --shard balances by file.
  browser:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.web == 'true'
    name: Browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Install fonts as well as shared libraries: a successful browser launch
      # alone does not guarantee the screenshot environment matches baselines.
      # --with-deps shells out to apt every time, so on a cache hit (the browser
      # and its system libraries are already present) install the shell alone.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        if: steps.chromium.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install --only-shell chromium
        if: steps.chromium.outputs.cache-hit == 'true'
      - run: pnpm run test:browser --project=behavior --project=desktop --project=mobile --shard=${{ matrix.shard }}/3 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/timings.json
      - name: Upload PWA screenshot review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-screenshots-${{ matrix.shard }}
          path: |
            test/browser/screenshots.spec.ts-snapshots/*.png
            test-results/**
          if-no-files-found: error
          retention-days: 14

  # Cheap, dependency-free check: no install is needed because check-links only
  # uses node:fs/node:path. Its own filter keeps docs-only feedback fast.
  docs-links:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - run: node scripts/check-links.mjs

  # Service checks use separate runners so control-plane verification does not
  # block relay feedback. They are cheap and path-filtered, so they run in every
  # tier. The relay suite still installs control-plane because it spawns that
  # service as a child process for integration coverage.
  control-plane:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.control_plane == 'true'
    name: Control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: native_push_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NATIVE_PUSH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/native_push_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # services/* are standalone npm projects with their own package-lock.json;
      # only the repo root migrated to pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: services/control-plane/package-lock.json
      - run: npm ci
        working-directory: services/control-plane
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/control-plane
      - run: npm run typecheck
        working-directory: services/control-plane
      - run: npm run test:unit
        working-directory: services/control-plane

  relay:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.relay == 'true'
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # services/* are standalone npm projects with their own package-lock.json;
      # only the repo root migrated to pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            services/relay/package-lock.json
            services/control-plane/package-lock.json
      - run: npm ci
        working-directory: services/control-plane
      - run: npm ci
        working-directory: services/relay
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/relay
      - run: npm run typecheck
        working-directory: services/relay
      - run: npm run --if-present test:unit
        working-directory: services/relay

  # Remote-path and X25519 pairing suites run on separate runners to keep each
  # suite's service ports isolated. They run whenever the node, core or services
  # change.
  remote-e2e:
    needs: changes
    if: needs.changes.outputs.tier == 'full' || needs.changes.outputs.e2e == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Remote path e2e
            script: test/remote-e2e.ts
          - name: X25519 pairing e2e
            script: test/remote-pairing-e2e.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: services/control-plane
      - run: npm ci
        working-directory: services/relay
      - run: pnpm exec tsx ${{ matrix.script }}

  # Single gate for branch protection. Always runs, and passes only if no needed
  # job failed or was cancelled. A skipped job means its area was untouched or
  # its tier did not run it. Keep this as the sole required status check.
  ci-ok:
    if: ${{ always() }}
    needs:
      - changes
      - policy
      - lint
      - types
      - unit
      - core
      - web-build
      - root-release
      - agent-certification
      - release-consumer
      - installer-smoke
      - browser
      - docs-links
      - control-plane
      - relay
      - remote-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify no required job failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A CI job failed or was cancelled." >&2
            exit 1
          fi
          echo "CI passed (skipped jobs are expected when their area was untouched)."

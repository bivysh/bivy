name: Agent certification upstream drift

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-certification-latest
  cancel-in-progress: true

jobs:
  report:
    name: Report latest upstream drift (non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      # Informational only: this command always leaves pins untouched and writes
      # review-required drift to the job summary instead of changing support.
      - run: node scripts/certification.mjs --latest

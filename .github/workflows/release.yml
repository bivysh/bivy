name: Release

# ONE trusted-publisher workflow driving BOTH npm channels. npm allows only a
# single trusted publisher (one workflow file) per package, so staging and
# production must live here together -- see docs/releasing.md.
#
#   push to main       -> STAGING (automatic). Publishes X.Y.Z-staging.N to
#                         the `staging` dist-tag on every merge. No approval, no
#                         git tag, never moves `latest`. This is the dev channel
#                         every change lands on.
#   push of a v* tag   -> PRODUCTION. `pnpm release` tags a commit already on
#                         main whose package.json holds that version; this run
#                         promotes it to the `latest` dist-tag, aliases its
#                         service images and creates the GitHub release. Pushing
#                         the tag is the approval: the release-tags ruleset lets
#                         only maintainers create v* tags.
#   workflow_dispatch  -> PRODUCTION retry, dispatched from the tag ref
#                         (`gh workflow run release.yml --ref vX.Y.Z`).
#
# CI gates the exact promoted commit. Main only advances through the merge
# queue, so a successful merge_group CI run on the tagged SHA is its receipt.
# A commit without one (pushed past branch protection, say) gets the canonical
# CI workflow's full tier, dispatched on the tag, before anything is published.
#
# Both jobs authenticate to npm with the job's GitHub Actions OIDC identity
# (`id-token: write`) against the ONE trusted publisher configured for
# `@bivy/bivy` -- there is no NPM_TOKEN. That trusted publisher MUST have its
# Environment field left BLANK: neither job runs in a GitHub environment.
# Provenance is attached automatically on both (scripts/build-release.mjs adds
# --provenance whenever GITHUB_ACTIONS + id-token are present).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a publish mid-flight. Keyed per ref and SHA so rapid merges
  # each publish their own unique staging version, and a release tag on a
  # fresh main commit never queues behind that commit's staging publish.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ STAGING --
  # Automatic on every merge to main. The whole point of the dev channel: any
  # change that lands is immediately installable via `@bivy/bivy@staging`.
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish staging build (dist-tag `staging`)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: trusted publish + provenance
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the pinned Node bundles an older
      # npm. Upgrade just the CLI rather than bumping the repo-wide Node version.
      - name: Upgrade npm for trusted publishing (requires npm >= 11.5.1)
        run: npm install -g npm@^11

      - run: pnpm install --frozen-lockfile

      # Stamp a unique, immutable prerelease version for this build. The counter
      # is scoped to the clean base version in package.json -- the version main
      # will release next -- so a new development minor starts at a readable
      # version like 0.15.0-staging.1 instead of using GitHub's repository-wide
      # run number. npm versions are immutable, so we derive the next suffix
      # from already-published versions for this base. Between a release and
      # its follow-up version bump, package.json names a released version;
      # staging then targets the next patch so builds still sort above `latest`.
      - name: Stamp a unique staging prerelease version
        run: |
          base="$(node -p "require('./package.json').version")"
          case "$base" in
            *-*) echo "::error::package.json version '$base' is already a prerelease; main must hold a clean X.Y.Z."; exit 1 ;;
          esac
          versions="$(npm view @bivy/bivy versions --json)"
          base="$(echo "$versions" | node -e '
            const versions = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            console.log(versions.includes(process.argv[1]) ? `${major}.${minor}.${patch + 1}` : process.argv[1]);
          ' "$base")"
          next="$(echo "$versions" | node -e '
            const versions = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const prefix = `${process.argv[1]}-staging.`;
            const suffixes = versions
              .filter((version) => version.startsWith(prefix))
              .map((version) => Number(version.slice(prefix.length)))
              .filter(Number.isSafeInteger);
            console.log(Math.max(0, ...suffixes) + 1);
          ' "$base")"
          version="${base}-staging.${next}"
          pnpm version --no-git-tag-version --allow-same-version "$version"
          echo "Publishing staging version: $version"

      # `--tag staging` keeps this off `latest`. Provenance is added automatically.
      - name: Publish to npm (dist-tag `staging`)
        run: pnpm run publish:npm -- --tag staging

  # --------------------------------------------------------------- PRODUCTION --
  # One job, so a release pays for one runner start. It validates the tag,
  # requires a CI receipt for the exact commit, then publishes.
  production:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Promote to npm `latest` + GitHub release
    runs-on: ubuntu-latest
    permissions:
      actions: write # read CI receipts; dispatch full CI when there is none
      contents: write # create the GitHub release
      packages: write # add stable tags to the already-built Core service images
      id-token: write # OIDC: trusted publish + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag must name package.json's version on a commit that is on main.
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse 'HEAD^{commit}')"
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "::error::package.json version '$version' is a prerelease; main must hold a clean X.Y.Z."; exit 1 ;;
          esac
          [ "$TAG" = "v$version" ] \
            || { echo "::error::Tag $TAG does not match package.json version $version at $sha. Tag the commit whose package.json holds the version (pnpm release does)."; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$TAG points to $sha, which is not on main. Only commits that landed through the merge queue can be released."; exit 1; }
          { echo "VERSION=$version"; echo "RELEASE_SHA=$sha"; } >> "$GITHUB_ENV"

      # A staging publish proves packaging, not correctness. Main only advances
      # through the merge queue, so its successful merge_group CI run on this
      # SHA is the receipt; so is a run where every job passed. A commit without
      # one (pushed past branch protection, say) gets the canonical CI workflow
      # -- its full tier, on this tag -- before anything is published. Do not
      # duplicate a subset of its checks here.
      - name: Require a CI receipt for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          runs() { gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&$1" --jq '.workflow_runs[] | "\(.id):\(.event)"'; }
          for run in $(runs status=success); do
            if [ "${run#*:}" = merge_group ]; then
              echo "Merge-queue CI run ${run%%:*} passed on $RELEASE_SHA."
              exit 0
            fi
            if [ "$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs" --jq '.jobs[] | select(.conclusion != "success") | .name' | wc -l)" -eq 0 ]; then
              echo "CI run ${run%%:*} already passed every job on $RELEASE_SHA."
              exit 0
            fi
          done
          echo "::warning::No CI receipt for $RELEASE_SHA; running the full CI tier on $TAG first."
          before="$(runs event=workflow_dispatch | head -n 1)"
          gh workflow run ci.yml --ref "$TAG"
          for attempt in $(seq 1 360); do
            sleep 10
            run="$(runs event=workflow_dispatch | head -n 1)"
            [ -n "$run" ] && [ "$run" != "$before" ] || continue
            conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}" --jq '.conclusion // ""')"
            case "$conclusion" in
              "") ;;
              success) echo "Full CI run ${run%%:*} passed on $RELEASE_SHA."; exit 0 ;;
              *) echo "::error::Full CI run ${run%%:*} on $RELEASE_SHA ended in '$conclusion'; nothing was published."; exit 1 ;;
            esac
          done
          echo "::error::Full CI on $RELEASE_SHA did not finish within an hour; nothing was published."
          exit 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (requires npm >= 11.5.1)
        run: npm install -g npm@^11

      - run: pnpm install --frozen-lockfile

      # The npm artifact ships only the root package, but keep all workspaces in
      # lockstep so the monorepo never publishes an internally inconsistent state.
      - name: Verify all workspaces agree on the version
        run: |
          for w in package.json packages/*/package.json services/*/package.json; do
            [ -f "$w" ] || continue
            wv="$(node -p "require('./$w').version")"
            [ "$wv" = "$VERSION" ] \
              || { echo "::error::$w is $wv but promoting $VERSION -- all workspace versions must match."; exit 1; }
          done

      # Validate release notes and require the immutable service artifacts BEFORE
      # the irreversible npm publish. Notes are CHANGELOG.md's [Unreleased]
      # section at the tagged commit plus the tag message (pnpm release
      # --notes-file); the follow-up version bump dates them in CHANGELOG.md.
      - name: Collect release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unreleased="$(node scripts/extract-changelog.mjs Unreleased 2>/dev/null || true)"
          # An annotated tag's message is "Bivy X.Y.Z", a blank line, then notes.
          tag_object="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq 'select(.object.type == "tag") | .object.sha')"
          tagged=""
          if [ -n "$tag_object" ]; then
            tagged="$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.message' | tail -n +3)"
          fi
          printf '%s\n\n%s\n' "$unreleased" "$tagged" | node -e 'process.stdout.write(require("fs").readFileSync(0, "utf8").trim() + "\n")' > release-notes.md
          [ -n "$(tr -d '[:space:]' < release-notes.md)" ] \
            || { echo "::error::No release notes: CHANGELOG.md's [Unreleased] section and the v$VERSION tag message are both empty."; exit 1; }
          cat release-notes.md

      - name: Require public Core service images for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          for attempt in $(seq 1 40); do
            published="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/status" \
              --jq '[.statuses[] | select(.context == "service-images/published" and .state == "success")] | length')"
            if [ "$published" -gt 0 ] \
              && docker buildx imagetools inspect "ghcr.io/bivysh/bivy-control-plane:$RELEASE_SHA" >/dev/null 2>&1 \
              && docker buildx imagetools inspect "ghcr.io/bivysh/bivy-relay:$RELEASE_SHA" >/dev/null 2>&1; then
              echo "The exact-SHA publication receipt and anonymous images are available."
              exit 0
            fi
            echo "Waiting for successful, public Core service images for $RELEASE_SHA ($attempt/40)..."
            sleep 15
          done
          echo "::error::Core service images were not successfully published for $RELEASE_SHA."
          exit 1

      # npm versions are immutable. The protected tag binds this version to one
      # commit, so a retry of a run that published and then failed later can
      # verify `latest` and resume without republishing. The image aliases are
      # independent of npm, so they are added at the same time.
      # A release tag is an alias of the already-tested SHA manifests, not a
      # rebuild. `latest` therefore points to byte-identical service artifacts.
      - name: Publish or resume npm `latest`; alias the service images
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          (
            for image in bivy-control-plane bivy-relay; do
              docker buildx imagetools create \
                --tag "ghcr.io/bivysh/$image:$VERSION" \
                --tag "ghcr.io/bivysh/$image:v$VERSION" \
                --tag "ghcr.io/bivysh/$image:latest" \
                "ghcr.io/bivysh/$image:$RELEASE_SHA"
            done
          ) & images=$!
          published="$(npm view "@bivy/bivy@$VERSION" version 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            latest="$(npm view @bivy/bivy dist-tags.latest)"
            [ "$latest" = "$VERSION" ] \
              || { echo "::error::npm $VERSION exists but latest points to $latest; refusing an ambiguous recovery."; exit 1; }
            echo "npm $VERSION is already published as latest; resuming promotion."
          else
            pnpm run publish:npm
          fi
          wait "$images"

      - name: Build the checksummed self-host deployment bundle
        run: node scripts/build-self-host.mjs self-host-release

      # The GitHub release is the last step on purpose: its existence is the
      # signal that npm and the images are live, for any deployment waiting on it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Bundles carry the immutable SHA whose public service images were
          # verified above; upload before publishing so the release is complete
          # the moment it appears.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists; refreshing its assets."
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md --draft
          fi
          gh release upload "v$VERSION" self-host-release/bivy-self-host.tar.gz \
            self-host-release/bivy-self-host.tar.gz.sha256 self-host-release/install.sh --clobber
          gh release edit "v$VERSION" --draft=false --latest

name: Ephemeral runner image

on:
  push:
    # Prebuild on review branches too. Staging deploys can then retag/use the
    # exact Core SHA immediately instead of spending several minutes compiling
    # node-pty and exporting the runner image on the deployment critical path.
    paths:
      - deploy/Dockerfile.ephemeral-runner
      - src/**
      - bin/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/build-release.mjs
      - .github/workflows/ephemeral-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ephemeral-runner-image-${{ github.ref }}
  cancel-in-progress: false

# The repository's Actions policy allows GitHub-owned actions plus a short
# allowlist only (see Settings → Actions → General). The `docker/*` actions are
# not on it, so this job drives the preinstalled Docker CLI directly; a build
# cache lives in a `:buildcache` tag on GHCR rather than the Actions cache,
# which run steps cannot reach without a third-party action.
env:
  IMAGE: ghcr.io/bivysh/bivy-ephemeral-runner

jobs:
  publish:
    name: publish (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [all, claude, codex, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The default `docker` driver cannot export a registry cache; a
      # docker-container builder can.
      - name: Create buildx builder
        run: docker buildx create --name bivy --driver docker-container --use

      # The `all` compatibility image keeps the historical unsuffixed tags.
      # Runtime variants omit unrelated agent binaries and are selected by the
      # managed launch endpoint from its requested runtime id.
      - name: Build and push image
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          suffix="-$VARIANT"
          cache_suffix="-$VARIANT"
          if [ "$VARIANT" = all ]; then
            suffix=""
            cache_suffix=""
          fi
          tags=(
            --tag "$IMAGE:sha-${GITHUB_SHA::7}${suffix}"
            --tag "$IMAGE:prebuild-${GITHUB_SHA}${suffix}"
          )
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=(--tag "$IMAGE:main${suffix}")
          fi
          docker buildx build \
            --file deploy/Dockerfile.ephemeral-runner \
            --build-arg "GITHUB_SHA=$GITHUB_SHA" \
            --build-arg "BIVY_RUNNER_AGENT=$VARIANT" \
            --push \
            "${tags[@]}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "service=bivy-staging-managed-runner" \
            --label "bivy.runner.agent=$VARIANT" \
            --cache-from "type=registry,ref=$IMAGE:buildcache${cache_suffix}" \
            --cache-to "type=registry,ref=$IMAGE:buildcache${cache_suffix},mode=max" \
            .

name: Core service images

# Build the distributable control-plane and relay artifacts in the repository
# that owns their source. Cloud and self-hosted deployments consume these exact
# images instead of rebuilding a Core commit in a deployment repository.
on:
  # Cloud pins every deployed Core commit, including commits that only touch
  # docs or tooling. Publish a full-SHA artifact for every main commit so that
  # pin always resolves; BuildKit reuses layers when image inputs did not change.
  push:
    branches: [main]
  # Build in the merge queue too. A queued commit becomes main's commit verbatim,
  # so publishing here means the images are usually ready when the merge lands
  # and the release job does not wait for them. The push run then only confirms
  # the receipt. A queue entry that fails leaves an unreferenced SHA tag.
  merge_group:
    types: [checks_requested]
  # Exercise both Dockerfiles on every published architecture before merge
  # without publishing anything.
  pull_request:
    branches: [main]
    paths:
      - deploy/Dockerfile.control-plane
      - deploy/Dockerfile.relay
      - services/control-plane/**
      - services/relay/**
      - packages/**
      - src/automation/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - LICENSE
      - NOTICE
      - .dockerignore
      - .github/workflows/service-images.yml
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Core ref to build (for backfills). Blank uses the selected workflow ref."
        required: false
        type: string

permissions:
  contents: read

# Publications are write-once and must not race, while superseded validation
# runs only waste runner time. Keep publication serialization at workflow scope
# so the per-service publish jobs below can still run in parallel.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('core-service-images-validate-{0}', github.event.pull_request.number) || 'core-service-images-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Build ${{ matrix.service }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            arch: amd64
            runner: ubuntu-latest
          - service: control-plane
            arch: arm64
            runner: ubuntu-24.04-arm
          - service: relay
            arch: amd64
            runner: ubuntu-latest
          - service: relay
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Buildx builder
        run: docker buildx create --name bivy-services --driver docker-container --use
      - name: Build image
        run: |
          docker buildx build \
            --file "deploy/Dockerfile.${{ matrix.service }}" \
            --platform "linux/${{ matrix.arch }}" \
            --output type=cacheonly \
            .

  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      core_sha: ${{ steps.version.outputs.core_sha }}
      published: ${{ steps.receipt.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.core_ref || github.sha }}
      - name: Resolve immutable version
        id: version
        run: echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The merge queue normally published and verified this exact SHA already.
      - name: Check for an existing publication receipt
        id: receipt
        env:
          CORE_SHA: ${{ steps.version.outputs.core_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$CORE_SHA/status" \
            --jq '[.statuses[] | select(.context == "service-images/published" and .state == "success")] | length')"
          if [ "$count" -gt 0 ]; then
            echo "$CORE_SHA already has verified public images; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Each architecture builds natively on its own runner (QEMU emulation of
  # arm64 was most of the old 2-minute build) and pushes by digest. The
  # manifest job then joins the pair under the full-SHA tag.
  build:
    if: github.event_name != 'pull_request' && needs.resolve.outputs.published != 'true'
    needs: resolve
    name: Build ${{ matrix.service }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [control-plane, relay]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - service: control-plane
            image: bivy-control-plane
          - service: relay
            image: bivy-relay
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.core_sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Create Buildx builder
        run: docker buildx create --name bivy-services --driver docker-container --use

      # A full-SHA tag is write-once. A rerun can repair a partially completed
      # pair, but never silently replace an artifact for an existing commit after
      # a mutable base image has advanced.
      - name: Build and push by digest
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
          IMAGE: ghcr.io/bivysh/${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CORE_SHA" >/dev/null 2>&1; then
            echo "$IMAGE:$CORE_SHA already exists; preserving it."
            exit 0
          fi
          docker buildx build \
            --file "deploy/Dockerfile.${{ matrix.service }}" \
            --platform "linux/$ARCH" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            --label "org.opencontainers.image.source=https://github.com/bivysh/bivy" \
            --label "org.opencontainers.image.revision=$CORE_SHA" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            --provenance=true \
            --sbom=true \
            --cache-from "type=registry,ref=$IMAGE:buildcache-$ARCH" \
            --cache-to "type=registry,ref=$IMAGE:buildcache-$ARCH,mode=max" \
            .
          mkdir -p digests
          jq -r '."containerimage.digest"' metadata.json > "digests/${{ matrix.service }}-$ARCH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: digests/
          if-no-files-found: ignore
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && needs.resolve.outputs.published != 'true'
    needs: [resolve, build]
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            image: bivy-control-plane
          - service: relay
            image: bivy-relay
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.service }}-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Tag the multi-platform manifest
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
          IMAGE: ghcr.io/bivysh/${{ matrix.image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CORE_SHA" >/dev/null 2>&1; then
            echo "$IMAGE:$CORE_SHA already exists; preserving it."
            exit 0
          fi
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/${{ matrix.service }}-$arch")"
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$CORE_SHA" "${sources[@]}"

  verify:
    if: github.event_name != 'pull_request' && needs.resolve.outputs.published != 'true'
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # GHCR visibility is UI-only. Operators make both packages public once;
      # every publication verifies that property before recording success.
      - name: Verify anonymous multi-platform pulls
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
        run: |
          set -euo pipefail
          for image in bivy-control-plane bivy-relay; do
            manifest="$(docker buildx imagetools inspect --raw "ghcr.io/bivysh/$image:$CORE_SHA")"
            for arch in amd64 arm64; do
              jq -e --arg arch "$arch" \
                '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' \
                <<<"$manifest" >/dev/null \
                || { echo "::error::ghcr.io/bivysh/$image:$CORE_SHA has no linux/$arch manifest"; exit 1; }
            done
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.core_sha }}

      - name: Smoke the published self-host stack
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
        run: |
          # workflow_dispatch can republish a historical ref predating this test.
          if [ -f scripts/smoke-self-host.sh ]; then
            bash scripts/smoke-self-host.sh "$CORE_SHA"
          else
            echo "Historical ref has no self-host image smoke script."
          fi

      # A commit status is a durable, exact-SHA publication receipt. Unlike an
      # Actions run query it also works when workflow_dispatch checked out an old
      # core_ref while the workflow definition itself came from current main.
      - name: Record published SHA
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$CORE_SHA" \
            -f state=success \
            -f context=service-images/published \
            -f description="Public control-plane and relay images verified" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

name: Core service images

# Build the distributable control-plane and relay artifacts in the repository
# that owns their source. Cloud and self-hosted deployments consume these exact
# images instead of rebuilding a Core commit in a deployment repository.
on:
  # Cloud pins every deployed Core commit, including commits that only touch
  # docs or tooling. Publish a full-SHA artifact for every main commit so that
  # pin always resolves; BuildKit reuses layers when image inputs did not change.
  push:
    branches: [main]
  # Exercise both Dockerfiles on every published architecture before merge
  # without publishing anything.
  pull_request:
    branches: [main]
    paths:
      - deploy/Dockerfile.control-plane
      - deploy/Dockerfile.relay
      - services/control-plane/**
      - services/relay/**
      - packages/**
      - src/automation/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - LICENSE
      - NOTICE
      - .dockerignore
      - .github/workflows/service-images.yml
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Core ref to build (for backfills). Blank uses the selected workflow ref."
        required: false
        type: string

permissions:
  contents: read

# Publications are write-once and must not race, while superseded validation
# runs only waste runner time. Keep publication serialization at workflow scope
# so the per-service publish jobs below can still run in parallel.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('core-service-images-validate-{0}', github.event.pull_request.number) || 'core-service-images-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Build ${{ matrix.service }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            arch: amd64
            runner: ubuntu-latest
          - service: control-plane
            arch: arm64
            runner: ubuntu-24.04-arm
          - service: relay
            arch: amd64
            runner: ubuntu-latest
          - service: relay
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Buildx builder
        run: docker buildx create --name bivy-services --driver docker-container --use
      - name: Build image
        run: |
          docker buildx build \
            --file "deploy/Dockerfile.${{ matrix.service }}" \
            --platform "linux/${{ matrix.arch }}" \
            --output type=cacheonly \
            .

  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      core_sha: ${{ steps.version.outputs.core_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.core_ref || github.sha }}
      - name: Resolve immutable version
        id: version
        run: echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name != 'pull_request'
    needs: resolve
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-plane
            image: bivy-control-plane
          - service: relay
            image: bivy-relay
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.core_sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Enable ARM64 emulation
        run: docker run --privileged --rm docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64

      - name: Create Buildx builder
        run: docker buildx create --name bivy-services --driver docker-container --use

      # A full-SHA tag is write-once. A rerun can repair a partially completed
      # pair, but never silently replace an artifact for an existing commit after
      # a mutable base image has advanced.
      - name: Build and publish
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
          IMAGE: ghcr.io/bivysh/${{ matrix.image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CORE_SHA" >/dev/null 2>&1; then
            echo "$IMAGE:$CORE_SHA already exists; preserving it."
          else
            docker buildx build \
              --file "deploy/Dockerfile.${{ matrix.service }}" \
              --platform linux/amd64,linux/arm64 \
              --push \
              --tag "$IMAGE:$CORE_SHA" \
              --label "org.opencontainers.image.source=https://github.com/bivysh/bivy" \
              --label "org.opencontainers.image.revision=$CORE_SHA" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
              --provenance=true \
              --sbom=true \
              --cache-from "type=registry,ref=$IMAGE:buildcache" \
              --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
              .
          fi

  verify:
    if: github.event_name != 'pull_request'
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # GHCR visibility is UI-only. Operators make both packages public once;
      # every publication verifies that property before recording success.
      - name: Verify anonymous multi-platform pulls
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
        run: |
          set -euo pipefail
          for image in bivy-control-plane bivy-relay; do
            manifest="$(docker buildx imagetools inspect --raw "ghcr.io/bivysh/$image:$CORE_SHA")"
            for arch in amd64 arm64; do
              jq -e --arg arch "$arch" \
                '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' \
                <<<"$manifest" >/dev/null \
                || { echo "::error::ghcr.io/bivysh/$image:$CORE_SHA has no linux/$arch manifest"; exit 1; }
            done
          done

      # A commit status is a durable, exact-SHA publication receipt. Unlike an
      # Actions run query it also works when workflow_dispatch checked out an old
      # core_ref while the workflow definition itself came from current main.
      - name: Record published SHA
        env:
          CORE_SHA: ${{ needs.resolve.outputs.core_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$CORE_SHA" \
            -f state=success \
            -f context=service-images/published \
            -f description="Public control-plane and relay images verified" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - curl installer (bivy.sh/install.sh)
        - npm i -g bivy
        - Other / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: e.g. Ubuntu 22.04, macOS 14.5, Debian 12
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: output of `node --version`
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent (if relevant)
      options:
        - Pi
        - Claude Code
        - Codex
        - OpenCode
        - Gemini CLI
        - Qwen Code
        - Goose
        - Aider
        - Cline
        - Crush
        - Not agent-related
    validations:
      required: false

  - type: textarea
    id: doctor
    attributes:
      label: bivy doctor output
      description: Run `bivy doctor` and paste the output here.
      render: text
    validations:
      required: false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Two static, media-scoped tags give the *system-default* browser-chrome
         color correctly before any JS runs (no flash of the wrong color on cold
         load) — theme.ts's applyTheme() only needs to touch these for an
         explicit light/dark override, not the common "system" case. The
         placeholders are filled at build time from `--bg` in
         packages/ui/tokens.css (vite.config.ts `bgTokens`) so the status bar /
         browser chrome always blends into the app background — there is no hex
         here to drift out of sync with the design system. -->
    <meta name="theme-color" content="%BIVY_BG_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="%BIVY_BG_LIGHT%" media="(prefers-color-scheme: light)" />
    <!-- Bivy mark: an alpine ridge + AI spark. icon.svg is the theme-adaptive
         SVG favicon modern browsers prefer. icon-192/512.png are the cropped
         raster form (manifest purpose "any") and double as the PNG favicon /
         apple-touch-icon fallback (neither applies adaptive masking, so a
         cropped icon is correct here). tent-logo.png is the full-bleed
         *maskable* source (purpose "maskable"), padded into the adaptive-icon
         safe zone so a circular/squircle mask never clips the mark — kept
         separate so the un-masked "any" contexts don't render it small/padded.
         All are served from the app root by the node daemon and control plane. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Bivy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" role="img" aria-labelledby="title desc">
  <title id="title">Bivy logo</title>
  <desc id="desc">A dark rounded badge with a cyan mountain bivy shelter and a Bivy wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f20"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 0.97  0 0 0 .45 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- mark -->
  <rect x="32" y="32" width="192" height="192" rx="46" fill="url(#bg)"/>
  <path d="M57 183h142" stroke="#263244" stroke-width="10" stroke-linecap="round"/>
  <path d="M75 173 128 74l53 99H75Z" fill="url(#cyan)" filter="url(#glow)"/>
  <path d="M97 173h62l-31-58-31 58Z" fill="#0a0f20" opacity=".94"/>
  <path d="M128 116v57" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" opacity=".92"/>
  <path d="M77 174c16-24 36-36 51-36s35 12 51 36" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round" opacity=".9"/>

  <!-- wordmark -->
  <text x="268" y="157" fill="#eef2f7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="104" font-weight="850" letter-spacing="-4">Bivy</text>
  <text x="274" y="198" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" letter-spacing=".6">PRIVATE AI RUNNER</text>
</svg>

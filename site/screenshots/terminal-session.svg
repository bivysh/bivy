<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Bivy terminal session</title>
  <desc id="desc">A Bivy terminal showing a fake GitHub issue session running locally, creating a worktree, testing, and opening a pull request.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif}
    </style>
  </defs>
  <rect width="1080" height="760" fill="#f8f8f8"/>
  <rect x="52" y="48" width="976" height="664" rx="18" fill="#111111" filter="url(#shadow)"/>
  <rect x="52" y="48" width="976" height="48" rx="18" fill="#1a1a1a"/>
  <path d="M52 78h976v28H52z" fill="#1a1a1a"/>
  <circle cx="82" cy="72" r="7" fill="#ff5f57"/>
  <circle cx="106" cy="72" r="7" fill="#febc2e"/>
  <circle cx="130" cy="72" r="7" fill="#28c840"/>
  <text x="540" y="78" class="sans" text-anchor="middle" font-size="14" fill="#888888">bivy — acme/web — MacBook Pro</text>

  <text x="86" y="140" class="mono" font-size="22" fill="#eeeeee"><tspan fill="#888888">$</tspan> bivy</text>
  <text x="86" y="184" class="mono" font-size="22" fill="#22aa44">✓ <tspan fill="#eeeeee">runner online:</tspan> <tspan fill="#f87c18">MacBook Pro</tspan></text>
  <text x="86" y="222" class="mono" font-size="22" fill="#22aa44">✓ <tspan fill="#eeeeee">agent:</tspan> <tspan fill="#f87c18">Claude Code</tspan></text>
  <text x="86" y="260" class="mono" font-size="22" fill="#22aa44">✓ <tspan fill="#eeeeee">provider login:</tspan> <tspan fill="#888888">synced E2E</tspan></text>
  <text x="86" y="298" class="mono" font-size="22" fill="#22aa44">✓ <tspan fill="#eeeeee">remote PWA:</tspan> <tspan fill="#888888">connected from phone</tspan></text>

  <rect x="86" y="336" width="908" height="1" fill="#333333"/>

  <text x="86" y="384" class="mono" font-size="22" fill="#888888">github</text>
  <text x="180" y="384" class="mono" font-size="22" fill="#eeeeee">issue #184 assigned to </text>
  <text x="530" y="384" class="mono" font-size="22" fill="#f87c18">bivy/macbook</text>

  <text x="86" y="430" class="mono" font-size="22" fill="#eeeeee">→ created worktree <tspan fill="#f87c18">.bivy/worktrees/issue-184</tspan></text>
  <text x="86" y="468" class="mono" font-size="22" fill="#eeeeee">→ checked out branch <tspan fill="#f87c18">bivy/issue-184-checkout-timeout</tspan></text>
  <text x="86" y="506" class="mono" font-size="22" fill="#eeeeee">→ running agent locally with repo tools and keys</text>
  <text x="86" y="544" class="mono" font-size="22" fill="#888888">tool</text>
  <text x="154" y="544" class="mono" font-size="22" fill="#eeeeee">npm test</text>
  <text x="86" y="582" class="mono" font-size="22" fill="#22aa44">✓ tests passed</text>
  <text x="86" y="620" class="mono" font-size="22" fill="#22aa44">✓ pull request opened: </text>
  <text x="366" y="620" class="mono" font-size="22" fill="#f87c18">github.com/acme/web/pull/219</text>
  <text x="86" y="666" class="mono" font-size="22" fill="#888888">session mirrored to phone · terminal takeover available</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Bivy mobile PWA session</title>
  <desc id="desc">A fake Bivy phone session connected to a MacBook runner, showing chat, activity, and a PR-ready status.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="760" height="1080" fill="#f8f8f8"/>
  <rect x="130" y="34" width="500" height="1012" rx="56" fill="#111111" filter="url(#shadow)"/>
  <rect x="146" y="50" width="468" height="980" rx="44" fill="#ffffff"/>
  <rect x="320" y="64" width="120" height="22" rx="11" fill="#111111" opacity="0.9"/>

  <rect x="146" y="104" width="468" height="78" fill="#ffffff"/>
  <line x1="146" y1="182" x2="614" y2="182" stroke="#e5e5e5"/>
  <circle cx="180" cy="143" r="5" fill="#22aa44"/>
  <text x="202" y="137" class="sans" font-size="18" font-weight="750" fill="#111111">Checkout timeout fix</text>
  <text x="202" y="160" class="sans" font-size="13" fill="#666666">MacBook Pro · Claude Code · acme/web</text>
  <rect x="500" y="124" width="78" height="34" rx="10" fill="#fff7ed" stroke="#f87c18"/>
  <text x="539" y="146" class="sans" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">PR ready</text>

  <rect x="168" y="204" width="188" height="42" rx="21" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="262" y="231" class="sans" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">#184 · worktree</text>
  <rect x="366" y="204" width="138" height="42" rx="21" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="435" y="231" class="sans" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Terminal</text>

  <rect x="238" y="280" width="338" height="92" rx="16" fill="#ffffff" stroke="#cccccc"/>
  <text x="260" y="306" class="sans" font-size="12" fill="#666666">You · from phone</text>
  <text x="260" y="334" class="sans" font-size="18" fill="#111111">Can you pick up issue #184</text>
  <text x="260" y="358" class="sans" font-size="18" fill="#111111">and open a PR?</text>

  <rect x="184" y="400" width="354" height="128" rx="16" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="206" y="426" class="sans" font-size="12" fill="#666666">Agent · running on MacBook</text>
  <text x="206" y="454" class="sans" font-size="18" fill="#111111">I created a new worktree and</text>
  <text x="206" y="478" class="sans" font-size="18" fill="#111111">branch. Editing the checkout</text>
  <text x="206" y="502" class="sans" font-size="18" fill="#111111">flow now.</text>

  <rect x="184" y="554" width="356" height="148" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="206" y="582" class="sans" font-size="13" font-weight="800" fill="#d97706">Activity</text>
  <circle cx="214" cy="616" r="5" fill="#22aa44"/><text x="232" y="622" class="sans" font-size="16" fill="#111111">Created branch bivy/issue-184</text>
  <circle cx="214" cy="652" r="5" fill="#22aa44"/><text x="232" y="658" class="sans" font-size="16" fill="#111111">Changed checkout timeout handling</text>
  <circle cx="214" cy="688" r="5" fill="#22aa44"/><text x="232" y="694" class="sans" font-size="16" fill="#111111">Tests passed</text>

  <rect x="238" y="730" width="338" height="74" rx="16" fill="#ffffff" stroke="#cccccc"/>
  <text x="260" y="756" class="sans" font-size="12" fill="#666666">You</text>
  <text x="260" y="784" class="sans" font-size="18" fill="#111111">Show terminal.</text>

  <rect x="184" y="832" width="356" height="118" rx="16" fill="#111111"/>
  <text x="206" y="860" class="sans" font-size="12" fill="#888888">Live terminal · MacBook Pro</text>
  <text x="206" y="896" class="mono" font-size="17" fill="#eeeeee"><tspan fill="#888888">$</tspan> npm test</text>
  <text x="206" y="928" class="mono" font-size="17" fill="#22aa44">✓ all tests passing · PR opened</text>

  <rect x="168" y="972" width="424" height="40" rx="20" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="190" y="998" class="sans" font-size="14" fill="#999999">Message Bivy…</text>
</svg>

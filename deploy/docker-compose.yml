# Production-ish deploy for the control plane + relay behind Caddy (auto-TLS).
#
# Prereqs on the VPS:
#   - Docker + compose plugin
#   - Two DNS A records pointing at the VPS:
#       app.example.com    -> control plane
#       relay.example.com -> relay
#   - Edit deploy/Caddyfile and deploy/.env with your domains/secret.
#
# Run:
#   cd deploy && cp .env.example .env && $EDITOR .env Caddyfile
#   docker compose up -d --build
#
# Then on your PC (the node):
#   npm run relay:setup -- \
#     --control-plane https://app.example.com \
#     --relay wss://relay.example.com \
#     --email you@example.com
#   npm run dev   # node dials the relay; run `bivy link` to pair a phone
#
# NODE_ENV defaults to production and unauthenticated development login is
# disabled. Configure email or GitHub OAuth before starting the stack.

# Cap container log growth so the json-file driver can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    # Keep one runaway service from OOMing the whole box.
    mem_limit: 1g
    cpus: 1.0
    environment:
      # NOTE: POSTGRES_USER/POSTGRES_DB only take effect when postgres runs
      # initdb on a FIRST, empty data dir. If you change them on a box whose
      # postgres_data volume already exists, the new role/database are NOT
      # created and the control plane crash-loops connecting to a role that
      # doesn't exist. Do not change these values after the first start unless
      # you also migrate the existing database roles and data.
      POSTGRES_DB: "${POSTGRES_DB:-bivy_control_plane}"
      POSTGRES_USER: "${POSTGRES_USER:-bivy}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
      args:
        # Optional ephemeral-machine UI, paired with the runtime flag below.
        VITE_EPHEMERAL_MACHINES_ENABLED: "${VITE_EPHEMERAL_MACHINES_ENABLED:-}"
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "4400"
      RELAY_SECRET: "${RELAY_SECRET}"
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL}"
      PUBLIC_CONTROL_PLANE_URL: "${PUBLIC_CONTROL_PLANE_URL}"
      # Self-hosted stacks do not have paid plan gates.
      ENFORCE_ENTITLEMENTS: "0"
      # Ephemeral-machines flag (server-side enforcement). OFF by default: with
      # NODE_ENV=production (the compose default) ephemeral is disabled unless you
      # set EPHEMERAL_MACHINES_ENABLED=1 here. When off, planAutoProvision refuses
      # server-initiated launches and the /api/ephemeral/exec provider relay 403s
      # device-initiated ones. Pairs with the build-time VITE_EPHEMERAL_MACHINES_ENABLED
      # above that exposes the UI. Does not touch a running machine's self-teardown,
      # so any existing machine still reaps itself when idle.
      EPHEMERAL_MACHINES_ENABLED: "${EPHEMERAL_MACHINES_ENABLED:-}"
      DISABLE_DEV_LOGIN: "${DISABLE_DEV_LOGIN:-1}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:-Bivy <login@localhost>}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-}"
      DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-10}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-bivy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bivy_control_plane}"
    # Raise the open-file-descriptor limit. Each enrolled node/phone introspection
    # and DB connection consumes FDs; the default 1024 caps concurrency well below
    # the hardware.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "4400"
    depends_on:
      - postgres
    restart: unless-stopped

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "4500"
      RELAY_SECRET: "${RELAY_SECRET}"
      CONTROL_PLANE_URL: "http://control-plane:4400"
      ENFORCE_ENTITLEMENTS: "0"
      RELAY_MAX_FRAME_BYTES: "${RELAY_MAX_FRAME_BYTES:-1048576}"
      # Per-socket message-rate caps. Set the CLIENT limit explicitly: the legacy
      # RELAY_MAX_MESSAGES_PER_MINUTE became the client limit via a fallback, and
      # a low value (it used to default to 120 here) trips "Rate limit exceeded"
      # in the app when a flapping node makes the relay replay peer.online bursts.
      RELAY_MAX_CLIENT_MESSAGES_PER_MINUTE: "${RELAY_MAX_CLIENT_MESSAGES_PER_MINUTE:-600}"
      RELAY_MAX_CONNECTIONS_PER_IP: "${RELAY_MAX_CONNECTIONS_PER_IP:-50}"
      RELAY_IDLE_TIMEOUT_MS: "${RELAY_IDLE_TIMEOUT_MS:-120000}"
    # The relay holds one WebSocket per node plus one per connected phone, so it
    # is the most FD-hungry service. At ~2 FDs/user the default 1024 limit walls
    # concurrency around ~500 users regardless of CPU/RAM.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "4500"
    restart: unless-stopped

  caddy:
    image: caddy:2
    logging: *default-logging
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane
      - relay
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
